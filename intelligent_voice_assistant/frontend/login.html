<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Intelligent Voice Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="auth-shell">

        <!-- =====================================================
             BRAND PANEL
        ====================================================== -->

        <section class="brand-panel">

            <div class="brand-mark">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>

            <div class="brand-copy">

                <p class="eyebrow">
                    Academic Automation
                </p>

                <h1>
                    Intelligent Voice
                    <br>
                    <span>Assistant</span>
                </h1>

                <p class="brand-description">
                    Student Marks Automation
                </p>

            </div>

            <div class="brand-footer">
                <i class="fa-solid fa-circle-check"></i>
                Secure academic workspace
            </div>

        </section>



        <!-- =====================================================
             LOGIN PANEL
        ====================================================== -->

        <section class="login-panel">

            <div class="login-card">

                <div class="mobile-brand">

                    <div class="brand-mark small">
                        <i class="fa-solid fa-microphone-lines"></i>
                    </div>

                </div>

                <p class="eyebrow">
                    Welcome Back
                </p>

                <h2>
                    Sign In
                </h2>

                <p class="subtitle">
                    Sign in to access your academic workspace.
                </p>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">
                            Email address
                        </label>

                        <div class="input-wrap">

                            <span class="input-icon">
                                <i class="fa-solid fa-envelope"></i>
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="teacher@example.com"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <div class="label-row">

                            <label for="password">
                                Password
                            </label>

                        </div>

                        <div class="input-wrap">

                            <span class="input-icon">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password">

                                Show

                            </button>

                        </div>

                    </div>


                    <button type="submit" id="loginBtn">

                        <span>Sign in to dashboard</span>

                        <span class="arrow">
                            <i class="fa-solid fa-arrow-right"></i>
                        </span>

                    </button>


                    <p id="message" role="status" aria-live="polite"></p>

                </form>


                <p class="login-footer">
                    <i class="fa-solid fa-shield-halved"></i>
                    Authorized users only &nbsp;•&nbsp; Intelligent Voice Assistant
                </p>

            </div>

        </section>


            </main>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");
        const password = document.getElementById("password");

        // =====================================================
        // SHOW / HIDE PASSWORD
        // =====================================================

        document.getElementById("togglePassword").addEventListener(
            "click",
            function () {

                const visible = password.type === "text";

                password.type = visible ? "password" : "text";

                this.textContent = visible ? "Show" : "Hide";

                this.setAttribute(
                    "aria-label",
                    visible ? "Show password" : "Hide password"
                );

            }
        );


        // =====================================================
        // LOGIN
        // Teacher and HOD use the same login screen.
        // Backend must return:
        //   role: "teacher" + teacher object
        //   OR
        //   role: "hod" + hod object
        // =====================================================

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const passwordValue = password.value;

            message.textContent = "Signing you in...";
            message.className = "loading";
            loginBtn.disabled = true;

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: passwordValue
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    /*
                     * Clear any previous role data first.
                     * This prevents an old Teacher/HOD session
                     * from remaining in localStorage.
                     */

                    localStorage.removeItem("teacher");
                    localStorage.removeItem("hod");

                    // =================================================
                    // HOD LOGIN
                    // =================================================

                    if (data.role === "hod") {

                        if (!data.hod) {
                            throw new Error(
                                "HOD login response is missing HOD data."
                            );
                        }

                        localStorage.setItem(
                            "hod",
                            JSON.stringify(data.hod)
                        );

                        message.textContent =
                            "HOD login successful!";

                        message.className = "success";

                        window.location.href =
                            "hod_dashboard.html";

                        return;
                    }


                    // =================================================
                    // TEACHER LOGIN
                    // =================================================

                    if (data.role === "teacher" || data.teacher) {

                        if (!data.teacher) {
                            throw new Error(
                                "Teacher login response is missing teacher data."
                            );
                        }

                        localStorage.setItem(
                            "teacher",
                            JSON.stringify(data.teacher)
                        );

                        message.textContent =
                            "Login successful!";

                        message.className = "success";

                        window.location.href =
                            "teacher-dashboard.html";

                        return;
                    }


                    // =================================================
                    // UNKNOWN ROLE
                    // =================================================

                    message.textContent =
                        "Login successful, but the user role is not recognized.";

                    message.className = "error";

                } else {

                    message.textContent =
                        data.message ||
                        "Invalid email or password.";

                    message.className = "error";

                }

            } catch (error) {

                console.error("Login error:", error);

                /*
                 * If JSON parsing or an unexpected response fails,
                 * show a useful message instead of silently failing.
                 */

                if (error instanceof SyntaxError) {

                    message.textContent =
                        "Invalid response from server.";

                } else if (
                    error.message &&
                    error.message.includes("response is missing")
                ) {

                    message.textContent =
                        error.message;

                } else {

                    message.textContent =
                        "Cannot connect to server. Please start FastAPI.";

                }

                message.className = "error";

            } finally {

                loginBtn.disabled = false;

            }

        });

    </script>

</body>

</html>
