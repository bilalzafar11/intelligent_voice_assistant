<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Intelligent Voice Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="auth-shell">

        <!-- =====================================================
             BRAND PANEL
        ====================================================== -->

        <section class="brand-panel">

            <div class="brand-mark">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>

            <div class="brand-copy">

                <p class="eyebrow">
                    Academic Automation
                </p>

                <h1>
                    Intelligent Voice
                    <br>
                    <span>Assistant</span>
                </h1>

                <p class="brand-description">
                    Student Marks Automation
                </p>

            </div>

            <div class="brand-footer">
                <i class="fa-solid fa-circle-check"></i>
                Secure teacher workspace
            </div>

        </section>


        <!-- =====================================================
             LOGIN PANEL
        ====================================================== -->

        <section class="login-panel">

            <div class="login-card">

                <div class="mobile-brand">

                    <div class="brand-mark small">
                        <i class="fa-solid fa-microphone-lines"></i>
                    </div>

                </div>

                <p class="eyebrow">
                    Welcome Back
                </p>

                <h2>
                    Teacher Login
                </h2>

                <p class="subtitle">
                    Sign in to manage student marks with ease.
                </p>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">
                            Email address
                        </label>

                        <div class="input-wrap">

                            <span class="input-icon">
                                <i class="fa-solid fa-envelope"></i>
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="teacher@example.com"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <div class="label-row">

                            <label for="password">
                                Password
                            </label>

                        </div>

                        <div class="input-wrap">

                            <span class="input-icon">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password">

                                Show

                            </button>

                        </div>

                    </div>


                    <button type="submit" id="loginBtn">

                        <span>Sign in to dashboard</span>

                        <span class="arrow">
                            <i class="fa-solid fa-arrow-right"></i>
                        </span>

                    </button>


                    <p id="message" role="status" aria-live="polite"></p>

                </form>


                <p class="login-footer">
                    <i class="fa-solid fa-shield-halved"></i>
                    Authorized teachers only &nbsp;•&nbsp; Intelligent Voice Assistant
                </p>

            </div>

        </section>

    </main>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");
        const password = document.getElementById("password");

        document.getElementById("togglePassword").addEventListener(
            "click",
            function () {

                const visible = password.type === "text";

                password.type = visible ? "password" : "text";

                this.textContent = visible ? "Show" : "Hide";

                this.setAttribute(
                    "aria-label",
                    visible ? "Show password" : "Hide password"
                );

            }
        );

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const passwordValue = password.value;

            message.textContent = "Signing you in...";
            message.className = "loading";
            loginBtn.disabled = true;

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/login",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password: passwordValue })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem("teacher", JSON.stringify(data.teacher));

                    message.textContent = "Login successful!";
                    message.className = "success";

                    window.location.href = "teacher-dashboard.html";

                } else {

                    message.textContent = data.message || "Invalid email or password.";
                    message.className = "error";

                }

            } catch (error) {

                console.error(error);

                message.textContent = "Cannot connect to server. Please start FastAPI.";
                message.className = "error";

            } finally {

                loginBtn.disabled = false;

            }

        });

    </script>

</body>

</html>
